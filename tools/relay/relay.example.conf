# Copy to ignored relay.local.conf. Paths are relative to the launch directory.
listen_address=127.0.0.1
port=27020
certificate_file=relay-cert.local.pem
key_file=relay-key.local.pem
# Public servers accept guest publishers by default. Set to 1 to require the secret below.
require_access_token=0
# Optional server-generated four-character invitations; full codes remain supported.
room_aliases=0
failed_guesses_per_minute=100
# Operator-controlled publisher secret; joiners use only the single-use code.
# Generate with eawr_relay_server --generate-token. Prefer storing secrets in out/ or outside the repo.
access_token=
# Optional relay route; set both keys together. Match coturn's shared secret.
turn_uri=
turn_secret=
# Or relay through Cloudflare Realtime TURN (do not combine with turn_uri / turn_secret).
# The key ID and API token belong in the environment, not here:
#   EAWR_RELAY_CLOUDFLARE_TURN_KEY_ID, EAWR_RELAY_CLOUDFLARE_TURN_API_TOKEN
# turn_provider=cloudflare
