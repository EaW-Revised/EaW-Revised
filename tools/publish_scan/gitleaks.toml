# gitleaks for the publish scan (tools/publish_scan/publish_scan.py): the default rules plus
# narrow allowlists for values reviewed as not secret.
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 digests the inventory revalidation test pins (audit: generic-api-key false positive)"
condition = "AND"
paths = ['''tests/inventory/acceptance/test_revalidation\.py''']
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "Fake Cloudflare TURN credentials in the provider unit test; never a real token."
condition = "AND"
paths = ['''tests/net/relay_cloudflare_tests\.cpp''']
regexes = ['''tok_SECRET_9f8e7d6c5b4a39281706''']
