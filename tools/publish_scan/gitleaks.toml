# gitleaks for the publish scan (tools/publish_scan/publish_scan.py): the default rules plus
# narrow allowlists for values reviewed as not secret.
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 digests the inventory revalidation test pins (audit: generic-api-key false positive)"
condition = "AND"
paths = ['''tests/inventory/acceptance/test_revalidation\.py''']
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "Fake Cloudflare TURN credentials in the provider unit test; never a real token."
condition = "AND"
paths = ['''tests/net/relay_cloudflare_tests\.cpp''']
regexes = ['''tok_SECRET_9f8e7d6c5b4a39281706''']

[[allowlists]]
description = "Mods profile diagnostic code EAWR-MODS-0107 named profile_missing_key (generic-api-key false positive on the identifier); never a credential."
condition = "AND"
paths = ['''include/eawr/mods/profile\.hpp''']
regexes = ['''^EAWR-MODS-[0-9]{4}$''']

[[allowlists]]
description = "Vendored xxHash header, AVX-512 lines data_key_lo/data_key_hi = _mm512_srli_epi64 (data_key, 32): generic-api-key false positive on the variable names, the captured value is the intrinsic name; never a credential."
condition = "AND"
paths = ['''third_party/xxhash/xxhash\.h''']
regexes = ['''^_mm512_srli_epi64$''']
