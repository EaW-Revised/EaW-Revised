# Pool-built x64 assets are the release gate. Hosted ARM/Apple verification runs
# only after publication; it cannot block, modify or pull a release.
name: Post-release verification
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: post-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify ${{ matrix.name }} (non-blocking)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64-gcc, os: ubuntu-24.04-arm }
          - { name: macos-clang, os: macos-15 }
    steps:
      - name: Check out the published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require a native ARM machine
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64|aarch64) ;; *) echo "Expected native ARM" >&2; exit 1 ;; esac

      - name: Install the Linux toolchain
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14

      - name: Install the Apple toolchain
        if: ${{ runner.os == 'macOS' }}
        run: brew install ninja

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify Linux ARM64
        timeout-minutes: 90
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-arm64-gcc
          cmake --build --preset linux-arm64-gcc
          ctest --preset linux-arm64-gcc -LE "game-data|installed-required"

      - name: Verify Apple Silicon
        timeout-minutes: 90
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B out/build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DEAWR_WARNINGS_AS_ERRORS=ON -DEAWR_ENABLE_SIM_BOUNDARY_CHECK=ON
          cmake --build out/build/macos --parallel 3
          ctest --test-dir out/build/macos --output-on-failure -LE "game-data|installed-required"

      - name: File a non-blocking verification ticket
        if: ${{ !cancelled() && failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Post-release verification: $TAG / $PLATFORM"
          # Repeat attempts reuse the open ticket. Never touch release assets or state.
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json title --jq '.[].title')
          if ! printf '%s\n' "$existing" | grep -Fxq "$title"; then
            printf 'Non-blocking ARM/Apple verification failed after publication.\n\nRun: %s\n\nInvestigate and fix forward; this result cannot block or pull the release.\n' "$RUN_URL" > issue-body.txt
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.txt
          fi
