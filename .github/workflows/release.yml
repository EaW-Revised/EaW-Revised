# Release on a version tag (docs/releasing.md): builds and tests each platform on GitHub-hosted runners,
# packages the headless tools and the viewer project with its GDExtension (no game data, no Godot
# binary), attests the build provenance of every archive, and opens a DRAFT GitHub Release with
# generated notes and SHA-256 sums. A maintainer reviews and publishes the draft by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_CPP_TAG: 10.0.0-stable
  GODOT_CPP_COMMIT: 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, preset: linux-x64-gcc }
          - { platform: windows-x64, os: windows-2022, preset: windows-msvc }
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tagged commit on main
        shell: bash
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Linux toolchain
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-14 clang-18

      - name: Publish scan
        run: python tools/publish_scan/publish_scan.py --gitleaks

      - name: Build and test the core
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET"

      - name: Fetch the pinned godot-cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GODOT_CPP_TAG" https://github.com/godotengine/godot-cpp.git out/godot/deps/godot-cpp
          test "$(git -C out/godot/deps/godot-cpp rev-parse HEAD)" = "$GODOT_CPP_COMMIT"

      - name: Build the viewer extension (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          cmake -S apps/viewer -B out/build/viewer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          cmake --build out/build/viewer --target eawr_viewer

      - name: Build the viewer extension (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          cmake -S apps/viewer -B out/build/viewer -G "Visual Studio 17 2022" -A x64
          cmake --build out/build/viewer --config Release --target eawr_viewer

      - name: Package
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ github.ref_name }}
        run: >-
          python tools/release/package_release.py --build-dir "out/build/${PRESET}"
          --platform "$PLATFORM" --version "$VERSION" --out out/release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*.zip

      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: out/release/*.zip
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out/release
          merge-multiple: true

      - name: SHA-256 sums
        run: python tools/release/package_release.py --sums-only --out out/release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" out/release/*.zip out/release/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "EaW Revised $TAG"
          --notes "Needs your own installation of Empire at War: Forces of Corruption and the pinned Godot 4.7.2; see docs/releasing.md."
